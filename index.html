<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f3f0;--card:#fff;--ink:#111;--mut:#666;--gold:#cfb87c;--goldD:#a68f5c;--line:#e2e2de;--r:14px}
@media(prefers-color-scheme:dark){:root{--bg:#0d0d0e;--card:#1a1a1c;--ink:#f1f1ef;--mut:#a3a6a8;--line:#2c2c2e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'DM Sans',system-ui,sans-serif}
h1,h2,h3,.logo{font-family:'Unbounded','DM Sans',system-ui,sans-serif;margin:0;letter-spacing:-.02em}
a{color:inherit}

/* buttons: flat, minimal, one clean hover */
button{font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 16px;transition:background .15s,border-color .15s,transform .1s}
button:hover{border-color:var(--goldD);transform:translateY(-1px)}
button:active{transform:translateY(0)}
button.p{background:#111;color:var(--gold);border-color:#111}
button.p:hover{background:#000}
button.on{background:var(--gold);color:#111;border-color:var(--gold)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

input,select,textarea{font:inherit;width:100%;padding:9px 13px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin:4px 0 12px;transition:border-color .15s}
input:focus,textarea:focus{border-color:var(--goldD)}

.app{display:grid;grid-template-columns:224px 1fr;min-height:100vh}
nav{background:#111;color:#eee;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;gap:10px;align-items:center;padding:2px 8px 18px}
.cul{height:34px}
.logo{font-size:16px;font-weight:700;color:var(--gold);line-height:1.2}
.logo small{display:block;font:500 11px 'DM Sans';color:#999;letter-spacing:.02em;margin-top:2px}
nav a{color:#bbb;padding:9px 12px;border-radius:9px;cursor:pointer;display:flex;justify-content:space-between;transition:background .15s,color .15s}
nav a:hover:not(.act){background:#1c1c1c;color:#fff}
nav a.act{background:var(--gold);color:#111;font-weight:700}
.badge{background:#fff;color:#000;border-radius:99px;padding:0 7px;font-size:11px}
.navfoot{margin-top:auto;display:flex;justify-content:center;padding-top:10px}
.navfoot img{width:64px;opacity:.9}

main{padding:22px 26px;max-width:1020px;width:100%}
.top{display:flex;gap:10px;margin-bottom:18px;align-items:center}
.top>input{margin:0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:box-shadow .15s,transform .15s}
.ev{display:flex;flex-direction:column;gap:6px}
.ev:hover,.org:hover{box-shadow:0 8px 20px rgba(0,0,0,.08);transform:translateY(-2px)}
.ev h3{font-size:15px;line-height:1.3}.mut{color:var(--mut);font-size:13px}
.ban{margin:-16px -16px 8px;height:108px;border-radius:var(--r) var(--r) 0 0;overflow:hidden;position:relative;background:#eee}
.ban svg,.ban img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.credit{position:absolute;right:6px;bottom:4px;font-size:10px;color:#fff;background:#000a;padding:1px 6px;border-radius:5px;text-decoration:none}
.date{font-weight:700;color:var(--goldD)}
.tag{display:inline-block;font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:7px;padding:1px 8px;margin-right:4px;background:#cfb87c1a}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
h2{font-size:19px;margin:24px 0 12px}h1{font-size:23px}

/* hero: one clean photo, no cycling, subtle parallax only */
.hero{position:relative;overflow:hidden;border-radius:18px;min-height:200px;display:flex;align-items:center;padding:30px;color:#fff}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.hero::before{content:'';position:absolute;inset:0;background:linear-gradient(100deg,#000 5%,#000c 45%,transparent 85%);z-index:1}
.hero .hc{position:relative;z-index:2;max-width:520px}
.hero h1{font-size:25px;color:var(--gold);line-height:1.2}
.hero p{margin:8px 0 0;color:#eee}
.hero .buf{position:absolute;right:22px;bottom:16px;width:104px;z-index:2}

.pagehead{height:88px;border-radius:16px;overflow:hidden;position:relative;margin-bottom:20px}
.pagehead img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pagehead::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,#000a,transparent 65%)}
.pagehead .pt{position:absolute;left:18px;bottom:12px;z-index:2;color:#fff;font:700 20px Unbounded}
.pagehead .lg{position:absolute;right:16px;top:16px;width:40px;height:40px;z-index:2;background:#fff;border-radius:50%;padding:5px;object-fit:contain}

/* stats strip — replaces the old gallery, needs no images, always fresh */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:18px 0 6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.stat b{display:block;font:800 26px Unbounded;color:var(--goldD)}
.stat span{color:var(--mut);font-size:13px}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal div{min-height:72px;border:1px solid var(--line);border-radius:9px;padding:4px;font-size:12px;background:var(--card)}
.cal .h{min-height:0;border:0;background:none;text-align:center;color:var(--mut)}
.cal i{display:block;font-style:normal;background:var(--gold);color:#111;border-radius:5px;padding:0 5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.map{background:#e6e9e2;border-radius:var(--r);border:1px solid var(--line);width:100%}
.pin{cursor:pointer}

.org .ban{height:70px}
.lg{width:52px;height:52px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font:800 14px Unbounded;margin:-30px 0 8px 6px;position:relative;z-index:2;padding:4px}
.lg img{width:100%;height:100%;object-fit:contain}

/* dropdown: simple, minimal, native-feeling */
.dd{position:relative}
.ddb{display:flex;align-items:center;gap:6px;white-space:nowrap}
.ddb span{font-size:11px;transition:transform .15s}
.dd.open .ddb span{transform:rotate(180deg)}
.dd ul{list-style:none;margin:6px 0 0;padding:6px;position:absolute;right:0;min-width:180px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:6;display:none}
.dd.open ul{display:block}
.dd li{padding:7px 10px;border-radius:7px;cursor:pointer;font-size:14px}
.dd li:hover{background:var(--bg)}
.dd li.on{background:var(--gold);color:#111;font-weight:700}

.modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;padding:16px;z-index:9}
.modal.show{display:grid}
.modal .card{width:min(440px,100%);max-height:90vh;overflow:auto}
.wm{height:44px;display:block;margin:0 0 12px}
.av{width:60px;height:60px;border-radius:50%;background:var(--gold);color:#111;display:grid;place-items:center;font:800 22px Unbounded}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,10px);background:#111;color:var(--gold);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;z-index:12;transition:.2s;font-weight:600}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;padding:26px;grid-column:1/-1;color:var(--mut)}
.empty img{height:70px;margin-bottom:8px}
.foot{margin-top:34px;border-radius:16px;background:#111;color:#ddd;padding:20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.foot img{height:38px}
.foot p{margin:0;flex:1;min-width:200px;font-size:12.5px}
.foot b{font:700 15px Unbounded;color:var(--gold)}

@media(max-width:720px){
.app{grid-template-columns:1fr}
nav{position:fixed;bottom:0;top:auto;height:auto;flex-direction:row;overflow-x:auto;z-index:5;padding:8px}
.brand,.navfoot{display:none}
main{padding:16px 14px 84px}
.hero .buf{width:70px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

lorado Boulder"><h2 style="margin-top:0">Sign in with your phone</h2><p class="mut">We’ll text you a 6-digit code. Demo mode: no text is sent, any 6 digits work.</p>
<label>Name<input id="sn" autocomplete="name"></label><label>Phone number<input id="sp" type="tel" inputmode="tel" placeholder="(303) 555-0123" autocomplete="tel"></label>
<div>Interests</div><div class="row" style="margin:6px 0 14px">${CATS.map(c=>`<button type="button" class="chip" onclick="this.classList.toggle('on')">${c}</button>`).join('')}</div>
<div class="row sp"><button onclick="closeM()">Cancel</button><button class="p" onclick="sendCode()">Send code</button></div>`}
function sendCode(){const n=$('#sn').value.trim(),d=$('#sp').value.replace(/\D/g,'').replace(/^1(?=\d{10}$)/,'');
if(!n||d.length!=10){toast('Enter your name and a 10-digit US phone number');return}
pend={name:n,phone:`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`,interests:[...document.querySelectorAll('.chip.on')].map(b=>b.textContent)};
modal(`<h2 style="margin-top:0">Enter your code</h2><p class="mut">Sent to ${pend.phone}.</p><label>6-digit code<input id="sc" inputmode="numeric" maxlength="6"></label>
<div class="row sp"><button onclick="modal(signin())">Back</button><button class="p" onclick="verify()">Verify</button></div>`)}
function verify(){if(!/^\d{6}$/.test($('#sc').value)){toast('Enter the 6-digit code');return}S.user=pend;save();closeM();toast('Signed in');render()}
function rsvp(id,kind){if(!need())return;const ev=S.events.find(e=>e.id==id),m=me();
['going','interested'].forEach(k=>{ev[k]=ev[k].filter(x=>x!=m)});if(kind!='none')ev[kind].push(m);
if(kind=='going')S.notifs.unshift({id:++S.seq,msg:`You’re going: ${ev.title} (${fmt(ev)})`,read:false});save();render()}
function follow(id){if(!need())return;const i=S.follows.indexOf(id);
if(i>-1)S.follows.splice(i,1);else{S.follows.push(id);S.notifs.unshift({id:++S.seq,msg:`You’re now following ${org(id).name}`,read:false})}save();render()}
function score(e){let s=0;if(S.follows.includes(e.org))s+=2;if(S.user&&S.user.interests.includes(e.cat))s+=1.5;return s-new Date(e.at)/1e13}
function upcoming(){const n=Date.now()-864e5;return S.events.filter(e=>new Date(e.at)>=n).sort((a,b)=>a.at<b.at?-1:1)}
const ART={Football:`<rect width="300" height="120" fill="#1f5a34"/>${[0,1,2,3,4,5].map(i=>`<rect x="${i*50}" width="25" height="120" fill="#27703f"/>`).join('')}<circle cx="150" cy="60" r="20" fill="none" stroke="#fff" stroke-opacity=".5"/>`,
Homecoming:`<rect width="300" height="120" fill="#000"/>${[30,90,150,210,270].map((x,i)=>`<path d="M${x-12} ${i%2?30:20}h24l-12 26Z" fill="${i%2?'#fff':'#cfb87c'}"/>`).join('')}`,
Community:`<rect width="300" height="120" fill="#1b1f2a"/>${[15,50,85,120,155,190,225,260,290].map(x=>`<circle cx="${x}" cy="${30+14*Math.sin(x/24)}" r="5" fill="#cfb87c"/>`).join('')}`};
const SKY={Campus:'#dbe7ef',Career:'#e8dcc4',Academic:'#d5dbe8'};
function realPhoto(p){return `<div class="ban"><img loading="lazy" alt="" src="${p.url}"><a class="credit" href="${p.creditUrl}?utm_source=campus-site" target="_blank" rel="noopener">${p.credit} / Unsplash</a></div>`}
function banner(c){const inner=ART[c]||`<rect width="300" height="120" fill="${SKY[c]||'#dbe7ef'}"/>`;
return `<div class="ban"><svg viewBox="0 0 300 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${inner}</svg></div>`}
function card(e){const m=me(),g=e.going.includes(m),i=e.interested.includes(m);
return `<div class="card ev">${e.photo?realPhoto(e.photo):banner(e.cat)}<span class="date">${fmt(e)}</span><h3>${e.title}</h3><div class="mut">${org(e.org).name} · ${e.place}</div><div><span class="tag">${e.cat}</span></div>
<p style="margin:0">${e.desc}</p><div class="mut"><a href="${e.src}" target="_blank" rel="noopener">Source ↗</a></div>
<div class="row"><button class="${g?'on':''}" onclick="rsvp(${e.id},'${g?'none':'going'}')">${g?'Going':'RSVP'}</button><button class="${i?'on':''}" onclick="rsvp(${e.id},'${i?'none':'interested'}')">${i?'Saved':'Save'}</button></div></div>`}

calendar(){const y=calM.getFullYear(),m=calM.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
let h=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="h">${x}</div>`).join('')+'<div style="border:0;background:none"></div>'.repeat(first);
for(let i=1;i<=n;i++){const ev=S.events.filter(e=>{const z=new Date(e.at);return z.getFullYear()==y&&z.getMonth()==m&&z.getDate()==i});h+=`<div><b>${i}</b>${ev.map(e=>`<i title="${e.title}">${e.title}</i>`).join('')}</div>`}
return `<div class="row sp"><h2 style="margin:0">${calM.toLocaleString([], {month:'long',year:'numeric'})}</h2><div class="row"><button onclick="calM=new Date(calM.getFullYear(),calM.getMonth()-1,1);render()" aria-label="Previous month">‹</button><button onclick="calM=new Date(calM.getFullYear(),calM.getMonth()+1,1);render()" aria-label="Next month">›</button></div></div><div class="cal" style="margin-top:12px">${h}</div>`},
map(){const pins=Object.entries(PLACES).map(([n,[x,z]])=>{const c=S.events.filter(e=>e.place==n).length;
return `<g class="pin" tabindex="0" onclick="pinClick('${n}')" onkeydown="if(event.key=='Enter')pinClick('${n}')"><circle cx="${x}" cy="${z}" r="${14+c*2}" fill="#cfb87c" stroke="#111" stroke-width="2"/><text x="${x}" y="${z+4}" text-anchor="middle" font-weight="700" font-size="12" fill="#111">${c}</text><text x="${x}" y="${z+34+c*2}" text-anchor="middle" font-size="11" fill="#111">${n}</text></g>`}).join('');
return `<h2 style="margin-top:0">Campus map</h2><p class="mut">Tap a location to see its events. Schematic layout, not to scale.</p>
<svg class="map" viewBox="0 0 560 300" role="img" aria-label="Campus event map">${pins}</svg><div id="pinlist" class="grid" style="margin-top:14px"></div>`},

profile(){if(!S.user)return `<h2 style="margin-top:0">Profile</h2><p>Sign in to see your profile.</p><button class="p" onclick="modal(signin())">Sign in</button>`;
const m=me(),g=S.events.filter(e=>e.going.includes(m)),i=S.events.filter(e=>e.interested.includes(m)),p=S.user.phone;
return `<div class="row"><div class="av">${S.user.name[0].toUpperCase()}</div><div><h1>${S.user.name}</h1><div class="mut">${p.slice(0,6)}•••-${p.slice(-4)}</div></div></div>
<h2>Interests</h2><div>${S.user.interests.map(x=>`<span class="tag">${x}</span>`).join('')||'<span class="mut">None chosen</span>'}</div>
<h2>Following</h2><div>${S.follows.map(id=>`<span class="tag">${org(id).name}</span>`).join('')||'<span class="mut">No organizations yet</span>'}</div>
<h2>Going</h2><div class="grid">${g.map(card).join('')||empty('No RSVPs yet.')}</div>
<h2>Saved</h2><div class="grid">${i.map(card).join('')||empty('Nothing saved.')}</div><p><button onclick="S.user=null;save();render()">Sign out</button></p>`}};
function pinClick(n){$('#pinlist').innerHTML=upcoming().filter(e=>e.place==n).map(card).join('')||empty('No events here yet.')}
function newEv(){if(!need())return;modal(`<h2 style="margin-top:0">Create event</h2><label>Title<input id="et"></label>
<label>Host<select id="eo">${ORGS.map(o=>`<option value="${o.id}">${o.name}</option>`).join('')}</select></label>
<label>Location<select id="ep">${Object.keys(PLACES).map(p=>`<option>${p}</option>`).join('')}</select></label>
<label>Category<select id="ec">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></label>
<label>Date and time<input id="ed" type="datetime-local"></label><label>Description<textarea id="ex" rows="3"></textarea></label>
<div class="row sp"><button onclick="closeM()">Cancel</button><button class="p" onclick="saveEv()">Publish event</button></div>`)}
function saveEv(){const ti=$('#et').value.trim(),d=$('#ed').value;if(!ti||!d){toast('Add a title and a date');return}
S.events.push(E(++S.seq,ti,+$('#eo').value,$('#ep').value,d,0,$('#ec').value,$('#ex').value||'No description yet.',SRC.ev));closeM();toast('Event added (this device only)');go('home')}
function go(v){view=v;render()}

fetch('/.netlify/functions/get-events').then(r=>r.ok?r.json():null).then(d=>{
  if(!d||!d.events||!d.events.length)return;
  const now=Date.now(),known=new Set(S.events.map(e=>e.title+e.at));
  d.events.forEach(le=>{
    if(new Date(le.at).getTime()<now-864e5)return;
    if(known.has(le.title+le.at))return;
    S.events.push({id:le.id,title:le.title,org:5,place:le.place,at:le.at,tba:le.tba,cat:le.cat,desc:le.desc,src:le.src,photo:le.photo,going:[],interested:[]});
  });
  render();
}).catch(()=>{});
