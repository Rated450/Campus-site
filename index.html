<style>
:root{--bg:#0b0c0e;--bg2:#131518;--card:#17191d;--card2:#1d2025;--ink:#f4f4f2;--mut:#9a9ea5;--gold:#cfb87c;--goldL:#e3d3a3;--line:#262a30;--r:16px;--ok:#5fb98a;--top:0px;--bot:0px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.logo{font-family:'Unbounded','DM Sans',system-ui,sans-serif;margin:0;letter-spacing:-.02em}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{height:0;width:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

button{font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:11px;padding:9px 16px;transition:transform .12s,border-color .15s,background .15s}
button:hover{border-color:var(--gold);transform:translateY(-1px)}
button:active{transform:translateY(0) scale(.98)}
button.p{background:var(--gold);color:#111;border-color:var(--gold)}
button.p:hover{background:var(--goldL)}
button.on{background:var(--ok);color:#0b0c0e;border-color:var(--ok)}
button.ghost{background:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

input,select,textarea{font:inherit;width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:11px;background:var(--card2);color:var(--ink);margin:4px 0 12px}
input:focus,textarea:focus{border-color:var(--gold)}
input::placeholder,textarea::placeholder{color:#6b6f76}

.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:var(--bg2);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;gap:9px;align-items:center;padding:2px 8px 16px}
.cul{height:30px}
.logo{font-size:16px;font-weight:800;color:var(--gold)}
.logo small{display:block;font:500 10px 'DM Sans';color:#777;letter-spacing:.03em;margin-top:1px}
nav a{color:#9ba0a7;padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;gap:10px;align-items:center;justify-content:space-between;font-weight:600;font-size:14px;transition:background .15s,color .15s}
nav a:hover:not(.act){background:#1f2227;color:#fff}
nav a.act{background:var(--gold);color:#111}
.badge{background:#e5484d;color:#fff;border-radius:99px;padding:0 6px;font-size:10px;font-weight:800}
.postbtn{margin:12px 0 8px}
.navfoot{margin-top:auto;padding-top:10px;text-align:center}
.navfoot img{width:52px;opacity:.85}

main{padding:0 26px 40px;max-width:1080px;width:100%}
.topbar{display:flex;justify-content:flex-end;align-items:center;padding:16px 0 4px;gap:10px}
.bell{position:relative;background:var(--card2);border-radius:50%;width:38px;height:38px;padding:0;display:grid;place-items:center;font-size:16px}
.bell .badge{position:absolute;top:-2px;right:-2px}

.hero{padding:18px 0 6px}
.hero h1{font-size:30px}
.hero p{color:var(--mut);margin:6px 0 0;font-size:15px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 15px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:13.5px;white-space:nowrap}
.chip.on{background:var(--gold);color:#111;border-color:var(--gold)}

h2{font-size:19px;margin:30px 0 4px;display:flex;align-items:center;gap:8px}
h2 small{font-size:12px;font-weight:600;color:var(--mut);background:var(--card2);padding:2px 8px;border-radius:7px;margin-left:auto}
.sub{color:var(--mut);font-size:13px;margin:0 0 14px}

.rail{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail>.evc{flex:none;width:270px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}

.evc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:transform .15s,border-color .15s}
.evc:hover{transform:translateY(-3px);border-color:#3a3f47}
.evc .ban{height:140px;position:relative;background:#20242a}
.evc .ban img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.evc .ban svg{position:absolute;inset:0;width:100%;height:100%}
.evc .credit{position:absolute;right:6px;bottom:6px;font-size:9px;color:#fff;background:#000a;padding:1px 6px;border-radius:5px}
.evc .cat{position:absolute;left:10px;top:10px;background:#000a;color:var(--goldL);font-size:11px;font-weight:800;padding:3px 9px;border-radius:8px;backdrop-filter:blur(4px)}
.evc .price{position:absolute;right:10px;top:10px;background:#000a;color:#fff;font-size:11px;font-weight:800;padding:3px 9px;border-radius:8px}
.evc .bd{padding:13px 14px 14px}
.evc .when{color:var(--gold);font-weight:700;font-size:12.5px}
.evc h3{font-size:15px;margin:4px 0 3px;line-height:1.25}
.evc .mut{color:var(--mut);font-size:12.5px}
.evc .going{display:flex;align-items:center;gap:6px;margin:10px 0}
.evc .going .n{font-size:12.5px;color:var(--mut)}
.evc .acts{display:flex;gap:7px;margin-top:2px}
.evc .acts button{flex:1;padding:8px 0;font-size:13px}
.evc .icobtn{flex:none;width:36px;padding:0}

.mut{color:var(--mut)}
.tag{display:inline-block;font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:7px;padding:1px 8px;margin-right:4px;background:#cfb87c14;color:var(--goldL)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}

.bmn{background:linear-gradient(135deg,#1a1d22,#0e1013);border:1px solid var(--line);border-radius:20px;padding:24px;margin-top:30px}
.bmn h2{margin:0 0 4px}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.opt{padding:9px 15px;border-radius:11px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:13.5px;cursor:pointer}
.opt.on{background:var(--gold);color:#111;border-color:var(--gold)}
.itin{margin-top:16px;display:flex;flex-direction:column;gap:0}
.itin .stop{display:flex;gap:14px;padding:12px 0}
.itin .t{color:var(--gold);font-weight:800;font-size:13px;width:64px;flex:none}
.itin .line{width:2px;background:var(--line);margin:4px 0 4px 10px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0 4px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px}
.stat b{display:block;font:800 24px Unbounded;color:var(--gold)}
.stat span{color:var(--mut);font-size:12.5px}

.pagehead{height:132px;border-radius:18px;overflow:hidden;position:relative;margin:16px 0 4px}
.pagehead img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pagehead::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,#0b0c0ee6,transparent 65%)}
.pagehead .pt{position:absolute;left:20px;bottom:14px;z-index:2;color:#fff;font:800 24px Unbounded}
.pagehead .lg{position:absolute;right:18px;top:18px;width:38px;height:38px;z-index:2;background:#fff;border-radius:50%;padding:5px}

.map{background:#171a1d;border-radius:var(--r);border:1px solid var(--line);width:100%}
.pin{cursor:pointer}

.filters{display:flex;gap:8px;overflow-x:auto;margin:14px 0}
.dd{position:relative}
.ddb{display:flex;align-items:center;gap:6px;white-space:nowrap}
.ddb span{font-size:10px}
.dd ul{list-style:none;margin:6px 0 0;padding:6px;position:absolute;left:0;min-width:170px;background:var(--card2);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px #000a;z-index:6;display:none}
.dd.open ul{display:block}
.dd li{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px}
.dd li:hover{background:#262a30}
.dd li.on{background:var(--gold);color:#111;font-weight:700}

.club{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.club .ban{height:64px;margin:-16px -16px 0;border-radius:var(--r) var(--r) 0 0;overflow:hidden;position:relative}
.club .ban svg,.club .ban img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.club .lg{width:52px;height:52px;border-radius:12px;background:#fff;border:3px solid var(--card);display:grid;place-items:center;margin:-30px 0 8px 4px;position:relative;z-index:2;padding:4px}
.club .lg img{width:100%;height:100%;object-fit:contain}

.post{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.post .row.sp{margin-bottom:6px}
.post .who{font-weight:700;font-size:13.5px}
.post .cat2{font-size:11px;color:var(--gold);font-weight:700}

.modal{position:fixed;inset:0;background:#000c;display:none;place-items:center;padding:16px;z-index:9}
.modal.show{display:grid}
.modal .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;width:min(440px,100%);max-height:90vh;overflow:auto}
.wm{height:38px;display:block;margin:0 0 12px}
.av{width:58px;height:58px;border-radius:50%;background:var(--gold);color:#111;display:grid;place-items:center;font:800 22px Unbounded}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,10px);background:var(--gold);color:#111;padding:10px 18px;border-radius:11px;opacity:0;pointer-events:none;z-index:12;transition:.2s;font-weight:700}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;padding:30px 16px;grid-column:1/-1;color:var(--mut);background:var(--card);border:1px dashed var(--line);border-radius:14px}
.empty img{height:52px;margin-bottom:10px;opacity:.8}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.foot{margin-top:40px;border-radius:16px;background:var(--bg2);border:1px solid var(--line);padding:20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.foot img{height:34px}
.foot p{margin:0;flex:1;min-width:200px;font-size:12px;color:var(--mut)}
.foot b{font:700 14px Unbounded;color:var(--gold)}

.mobnav{display:none}
@media(max-width:760px){
.app{grid-template-columns:1fr}
nav{display:none}
main{padding:0 16px 90px}

lorado Boulder"><h2 style="margin-top:0">Sign in with your phone</h2><p class="mut">We’ll text you a 6-digit code. Demo mode: no text is sent, any 6 digits work.</p>
<label>Name<input id="sn" autocomplete="name"></label><label>Phone number<input id="sp" type="tel" inputmode="tel" placeholder="(303) 555-0123" autocomplete="tel"></label>
<div style="margin:2px 0 6px;font-weight:700;font-size:13px">What are you into?</div><div class="row" style="margin:0 0 14px">${INTERESTS.map(c=>`<button type="button" class="chip" onclick="this.classList.toggle('on')">${c}</button>`).join('')}</div>

function sendCode(){const n=$('#sn').value.trim(),d=$('#sp').value.replace(/\D/g,'').replace(/^1(?=\d{10}$)/,'');
if(!n||d.length!=10){toast('Enter your name and a 10-digit US phone number');return}
pend={name:n,phone:`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`,interests:[...document.querySelectorAll('.chip.on')].map(b=>b.textContent)};
modal(`<h2 style="margin-top:0">Enter your code</h2><p class="mut">Sent to ${pend.phone}.</p><label>6-digit code<input id="sc" inputmode="numeric" maxlength="6"></label>
<div class="row sp"><button onclick="modal(signin())">Back</button><button class="p" onclick="verify()">Verify</button></div>`)}
function verify(){if(!/^\d{6}$/.test($('#sc').value)){toast('Enter the 6-digit code');return}S.user=pend;save();closeM();toast('Signed in — Sko!');render()}
function rsvp(id,kind,btn){if(!need())return;const ev=S.events.find(e=>e.id==id),m=me();
const was=ev.going.includes(m);
['going','interested'].forEach(k=>{ev[k]=ev[k].filter(x=>x!=m)});if(kind!='none')ev[kind].push(m);
if(kind=='going'&&!was){S.notifs.unshift({id:++S.seq,msg:`You’re going: ${ev.title} (${fmt(ev)})`,read:false});if(btn){btn.textContent='You’re Going 🔥';btn.classList.add('on')}}
save();render()}
function follow(id){if(!need())return;const i=S.follows.indexOf(id);
if(i>-1)S.follows.splice(i,1);else{S.follows.push(id);S.notifs.unshift({id:++S.seq,msg:`You’re now following ${org(id).name}`,read:false})}save();render()}
function score(e){let s=0;if(S.follows.includes(e.org))s+=2;if(S.user&&S.user.interests&&S.user.interests.includes(e.cat))s+=1.5;if(isToday(e))s+=1;return s-new Date(e.at)/1e13}
function upcoming(){const n=Date.now()-864e5;return S.events.filter(e=>new Date(e.at)>=n).sort((a,b)=>a.at<b.at?-1:1)}
const ART={Sports:`<rect width="300" height="140" fill="#123321"/>${[0,1,2,3,4,5].map(i=>`<rect x="${i*50}" width="25" height="140" fill="#17402a"/>`).join('')}<circle cx="150" cy="70" r="22" fill="none" stroke="#cfb87c" stroke-opacity=".6"/>`,

function realPhoto(p){return `<img loading="lazy" alt="" src="${p.url}"><a class="credit" href="${p.creditUrl}?utm_source=skobuffs" target="_blank" rel="noopener">${p.credit} / Unsplash</a>`}
function banner(e){const inner=ART[e.cat]||`<rect width="300" height="140" fill="#171a1d"/>`;
return `<div class="ban">${e.photo?realPhoto(e.photo):`<svg viewBox="0 0 300 140" preserveAspectRatio="xMidYMid slice">${inner}</svg>`}<span class="cat">${e.cat}</span><span class="price">${e.free?'FREE':'$$'}</span></div>`}
function card(e){const m=me(),g=e.going.includes(m),i=e.interested.includes(m),n=cnt(e);
return `<div class="evc">${banner(e)}<div class="bd"><div class="when">${fmt(e)}</div><h3>${e.title}</h3><div class="mut">${org(e.org).name} · ${e.place}</div>
<div class="going"><span style="font-size:15px">${n?'🔥':'👀'}</span><span class="n">${n?n+' on this device going or interested':'Be the first from this device'}</span></div>
<div class="acts"><button class="${g?'on':''}" onclick="rsvp(${e.id},'${g?'none':'going'}',this)">${g?'You’re Going 🔥':'I’m Going'}</button><button class="icobtn ${i?'on':''}" title="Save" onclick="rsvp(${e.id},'${i?'none':'interested'}')">${i?'★':'☆'}</button><button class="icobtn" title="Share" onclick="shareEv(${e.id})">↗</button></div></div></div>`}
function shareEv(id){const e=S.events.find(x=>x.id==id);const text=`${e.title} — ${fmt(e)} at ${e.place}. via SkoBuffs`;
if(navigator.share){navigator.share({title:e.title,text,url:e.src}).catch(()=>{})}else{navigator.clipboard?.writeText(text+' '+e.src);toast('Copied — share it with your people')}}
function tagMatch(e){if(!chipF)return true;
if(chipF=='Tonight')return isToday(e);
if(chipF=='Free')return !!e.free;
if(chipF=='Trending')return cnt(e)>0;

function greet(){const h=new Date().getHours();return h<12?'Good morning':h<18?'Good afternoon':'Good evening'}
function statsStrip(){const up=upcoming(),next=up[0],dl=next?Math.max(0,Math.ceil((new Date(next.at)-Date.now())/864e5)):0;
const cat={};up.forEach(e=>cat[e.cat]=(cat[e.cat]||0)+1);const top=Object.entries(cat).sort((a,b)=>b[1]-a[1])[0];
return `<div class="stats"><div class="stat"><b>${up.length}</b><span>events on the calendar</span></div><div class="stat"><b>${dl}${dl==1?' day':' days'}</b><span>until ${next?next.title:'the next event'}</span></div><div class="stat"><b>${top?top[0]:'—'}</b><span>most active category</span></div></div>`}
const CHIPS=[['🔥','Trending'],['🌙','Tonight'],['🆓','Free'],['🎵','Music'],['🏃','Sports'],['🎓','Academic'],['💼','Career'],['🎨','Arts'],['🌲','Outdoors']];
function chipsHTML(){return `<div class="chips">${CHIPS.map(([ic,c])=>`<button class="chip ${chipF==c?'on':''}" onclick="setChip('${c}')">${ic} ${c}</button>`).join('')}</div>`}
function setChip(c){chipF=chipF==c?'':c;go('discover')}
const V={
home(){const up=upcoming(),tonight=up.filter(isToday),fy=[...up].sort((a,b)=>score(b)-score(a)).slice(0,4),trend=[...up].sort((a,b)=>cnt(b)-cnt(a)).slice(0,3);
return `<div class="hero"><h1>${greet()}, ${S.user?S.user.name.split(' ')[0]:'Buff'}</h1><p>What's happening around Boulder?</p></div>
${chipsHTML()}
<h2>Tonight in Boulder</h2><p class="sub">${tonight.length?"What's on today, ranked by what this device has already shown interest in.":"Nothing dated for today on the calendar right now — check Discover for what's coming up."}</p>
<div class="rail">${(tonight.length?tonight:up.slice(0,3)).map(card).join('')||empty('Nothing today','Check back tomorrow or browse Discover.')}</div>
<h2>For you</h2><p class="sub">${S.user?'Based on your interests and what you follow.':'Sign in and pick a few interests to personalize this.'}</p>
<div class="rail">${fy.map(card).join('')}</div>
<h2>🔥 Trending right now <small>this device</small></h2><p class="sub">Ranked by real RSVPs and saves on this device. Trending across all Buffs unlocks once accounts launch.</p>
<div class="rail">${trend.some(e=>cnt(e)>0)?trend.map(card).join(''):empty('Nothing trending yet','RSVP or save an event to get this started.')}</div>
${statsStrip()}
<div class="bmn"><h2 style="margin:0">🌙 Build My Night</h2><p class="sub">Pick a vibe and we'll pull together a real lineup from what's actually on the calendar.</p><button class="p" onclick="go('build')">Build my night</button></div>`},
discover(){const up=upcoming().filter(tagMatch);
return `${chipsHTML()}<h2 style="margin-top:8px">Discover</h2><p class="sub">${chipF?chipF+' · '+up.length+' events':up.length+' upcoming events'}</p>
<div class="grid">${up.map(card).join('')||empty('Nothing matches',"Try a different filter.")}</div>`},
build(){const CATMAP={Chill:'Arts',Social:'Homecoming',Active:'Sports',Music:'Music',Party:'Homecoming',Productive:'Career',Random:''};
const picks=bmn.mood?upcoming().filter(e=>{const wantCat=CATMAP[bmn.mood];const catOk=!wantCat||e.cat==wantCat||(e.tags||[]).includes(wantCat);const freeOk=bmn.budget!='Free'||e.free;return catOk&&freeOk}).slice(0,3):[];
return `<h2 style="margin-top:16px">🌙 Build My Night</h2><p class="sub">Real events only — pulled from what's actually on the calendar, not invented.</p>
<div class="bmn" style="margin-top:0">
<div style="font-weight:700;margin-bottom:6px">Mood</div><div class="opts">${['Chill','Social','Active','Music','Party','Productive','Random'].map(m=>`<div class="opt ${bmn.mood==m?'on':''}" onclick="bmn.mood='${m}';go('build')">${m}</div>`).join('')}</div>
<div style="font-weight:700;margin:10px 0 6px">Budget</div><div class="opts">${['Free','Under $25','Doesn’t matter'].map(m=>`<div class="opt ${bmn.budget==m?'on':''}" onclick="bmn.budget='${m}';go('build')">${m}</div>`).join('')}</div>
<div style="font-weight:700;margin:10px 0 6px">Who</div><div class="opts">${['By myself','Meet new people'].map(m=>`<div class="opt ${bmn.who==m?'on':''}" onclick="bmn.who='${m}';go('build')">${m}</div>`).join('')}</div>
${bmn.mood?`<div class="itin">${picks.length?picks.map((e,i)=>`<div class="stop"><div class="t">${fmt(e).split('·')[1]||''}</div><div><div style="font-weight:700">${e.title}</div><div class="mut">${e.place}</div></div></div>`).join(''):`<p class="mut" style="margin-top:14px">No real events on the calendar match that mood right now — try Random or a different budget.</p>`}</div>`:''}
</div>`},
calendar(){const y=calM.getFullYear(),m=calM.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
let h=['S','M','T','W','T','F','S'].map(x=>`<div class="h">${x}</div>`).join('')+'<div style="border:0;background:none"></div>'.repeat(first);
for(let i=1;i<=n;i++){const ev=S.events.filter(e=>{const z=new Date(e.at);return z.getFullYear()==y&&z.getMonth()==m&&z.getDate()==i});h+=`<div><b>${i}</b>${ev.map(e=>`<i title="${e.title}">${e.title}</i>`).join('')}</div>`}
return `<div class="row sp" style="margin-top:16px"><h2 style="margin:0">${calM.toLocaleString([], {month:'long',year:'numeric'})}</h2><div class="row"><button onclick="calM=new Date(calM.getFullYear(),calM.getMonth()-1,1);render()">‹</button><button onclick="calM=new Date(calM.getFullYear(),calM.getMonth()+1,1);render()">›</button></div></div><div class="cal" style="margin-top:12px">${h}</div>`},
map(){const pins=Object.entries(PLACES).map(([n,[x,z]])=>{const c=S.events.filter(e=>e.place==n).length;
return `<g class="pin" tabindex="0" onclick="pinClick('${n}')" onkeydown="if(event.key=='Enter')pinClick('${n}')"><circle cx="${x}" cy="${z}" r="${14+c*2}" fill="#cfb87c" stroke="#0b0c0e" stroke-width="2"/><text x="${x}" y="${z+4}" text-anchor="middle" font-weight="800" font-size="12" fill="#111">${c}</text><text x="${x}" y="${z+34+c*2}" text-anchor="middle" font-size="11" fill="#cfb87c">${n}</text></g>`}).join('');
return `<h2 style="margin-top:16px">Campus map</h2><p class="sub">Tap a location to see what's happening there. Schematic layout, not to scale.</p>
<svg class="map" viewBox="0 0 560 300" role="img" aria-label="Campus event map">${pins}</svg><div id="pinlist" class="grid" style="margin-top:14px"></div>`},
people(){return `<h2 style="margin-top:16px">Find your people</h2><p class="sub">Post what you're looking to do. Right now this board is visible only on this device — it becomes a real shared board once accounts launch.</p>
<button class="p" onclick="newPost()" style="margin-bottom:14px">+ Post</button>

profile(){if(!S.user)return `<h2 style="margin-top:16px">Profile</h2><p class="mut">Sign in to see your profile.</p><button class="p" onclick="modal(signin())">Sign in</button>`;
const m=me(),g=S.events.filter(e=>e.going.includes(m)),sv=S.events.filter(e=>e.interested.includes(m)),p=S.user.phone,cat={};
g.forEach(e=>cat[e.cat]=(cat[e.cat]||0)+1);
return `<div class="row" style="margin-top:16px"><div class="av">${S.user.name[0].toUpperCase()}</div><div><h1>${S.user.name}</h1><div class="mut">${p.slice(0,6)}•••-${p.slice(-4)}</div></div></div>
<h2>Your CU Fall <small>this device</small></h2><div class="stats"><div class="stat"><b>${g.length}</b><span>events you're going to</span></div><div class="stat"><b>${sv.length}</b><span>events saved</span></div><div class="stat"><b>${S.follows.length}</b><span>clubs followed</span></div></div>
<h2>Interests</h2><div>${(S.user.interests||[]).map(x=>`<span class="tag">${x}</span>`).join('')||'<span class="mut">None chosen yet</span>'}</div>
<h2>Going</h2><div class="grid">${g.map(card).join('')||empty('No RSVPs yet')}</div>
<h2>Saved</h2><div class="grid">${sv.map(card).join('')||empty('Nothing saved')}</div><p style="margin-top:14px"><button onclick="S.user=null;save();render()">Sign out</button></p>`}};
function pinClick(n){$('#pinlist').innerHTML=upcoming().filter(e=>e.place==n).map(card).join('')||empty('Nothing here yet')}
function newPost(){if(!need())return;modal(`<h2 style="margin-top:0">New post</h2><label>What are you looking to do?<textarea id="pt" rows="3" placeholder="Looking for 3 people to hike Chautauqua Saturday."></textarea></label>
<label>Category<select id="pc">${['Sports','Study','Gym','Hiking','Music','Food','Other'].map(c=>`<option>${c}</option>`).join('')}</select></label>
<div class="row sp"><button onclick="closeM()">Cancel</button><button class="p" onclick="savePost()">Post</button></div>`)}
function savePost(){const t=$('#pt').value.trim();if(!t){toast('Write something first');return}
S.posts.unshift({id:++S.seq,name:S.user.name,cat:$('#pc').value,text:t});save();closeM();toast('Posted — visible on this device');go('people')}
function newEv(){if(!need())return;modal(`<h2 style="margin-top:0">Create event</h2><label>Title<input id="et"></label>
<label>Host<select id="eo">${ORGS.map(o=>`<option value="${o.id}">${o.name}</option>`).join('')}</select></label>
<label>Location<select id="ep">${Object.keys(PLACES).map(p=>`<option>${p}</option>`).join('')}</select></label>
<label>Category<select id="ec">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></label>
<label>Free event?<select id="ef"><option value="1">Free</option><option value="0">Paid / ticketed</option></select></label>
<label>Date and time<input id="ed" type="datetime-local"></label><label>Description<textarea id="ex" rows="3"></textarea></label>
<div class="row sp"><button onclick="closeM()">Cancel</button><button class="p" onclick="saveEv()">Publish event</button></div>`)}
function saveEv(){const ti=$('#et').value.trim(),d=$('#ed').value;if(!ti||!d){toast('Add a title and a date');return}
S.events.push(E(++S.seq,ti,+$('#eo').value,$('#ep').value,d,0,$('#ec').value,$('#ex').value||'No description yet.',SRC.ev,+$('#ef').value,[]));closeM();toast('Event added — visible on this device');go('discover')}
function go(v){view=v;render()}
