<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CU Buffs Campus — CU Boulder</title><link rel="icon" href="assets/cu-logo.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#ecebe6;--card:#fff;--ink:#111;--mut:#565a5c;--gold:#cfb87c;--line:#dcdcd8;--r:16px}
@media(prefers-color-scheme:dark){:root{--bg:#0b0b0c;--card:#1a1a1c;--ink:#f1f1ef;--mut:#a3a6a8;--line:#2e2e30}}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 85% -10%,#cfb87c33,transparent),var(--bg);color:var(--ink);font:15px/1.55 'DM Sans',system-ui,sans-serif}
h1,h2,h3,.logo{font-family:'Unbounded','DM Sans',system-ui,sans-serif;margin:0;letter-spacing:-.03em}
#glow{position:fixed;left:0;top:0;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,#cfb87c40,transparent 65%);pointer-events:none;z-index:1;mix-blend-mode:soft-light}
button{font:inherit;font-weight:600;cursor:pointer;position:relative;overflow:hidden;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 16px;box-shadow:0 4px 0 rgba(0,0,0,.16);transform:translate(var(--tx,0),var(--ty,0));transition:transform .15s cubic-bezier(.3,1.6,.5,1),box-shadow .15s,background .2s}
button:hover{transform:translate(var(--tx,0),calc(var(--ty,0px) - 3px));box-shadow:0 7px 0 rgba(0,0,0,.16),0 12px 18px rgba(0,0,0,.12)}
button:active{transform:translate(var(--tx,0),calc(var(--ty,0px) + 3px)) scale(.97);box-shadow:0 1px 0 rgba(0,0,0,.2)}
button.p{background:#111;color:#cfb87c;border-color:#111}button.on{background:var(--gold);color:#111;border-color:var(--gold);animation:pop .35s}
.rip{position:absolute;border-radius:50%;background:#fff8;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}@keyframes pop{40%{transform:scale(1.15)}}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.96)}}@keyframes swap{from{opacity:0;transform:translateX(18px)}}
@keyframes float{50%{transform:translateY(-8px) rotate(3deg)}}@keyframes pulse{50%{transform:scale(1.12)}}
button:focus-visible,input:focus-visible,a:focus-visible,.pin:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,select,textarea{font:inherit;width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);margin:4px 0 12px;transition:box-shadow .2s,transform .2s}
input:focus,textarea:focus,select:focus{box-shadow:0 0 0 3px #cfb87c88;transform:translateY(-1px)}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh;position:relative;z-index:2}
nav{background:linear-gradient(180deg,#000,#16130c);color:#eee;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;border-right:4px solid var(--gold)}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 18px}.cul{height:46px;background:#fff;border-radius:12px;padding:3px;box-shadow:0 4px 0 #8a7a4a}.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.gal figure{margin:0;border-radius:16px;overflow:hidden;position:relative;height:190px;box-shadow:0 10px 24px rgba(0,0,0,.2);transition:transform .3s cubic-bezier(.3,1.5,.5,1)}.gal figure:hover{transform:translateY(-6px) scale(1.03)}.gal img{width:100%;height:100%;object-fit:cover;transition:transform .6s}.gal figure:hover img{transform:scale(1.1)}.gal figcaption{position:absolute;left:0;right:0;bottom:0;padding:24px 12px 10px;color:#fff;font-weight:600;font-size:13px;background:linear-gradient(transparent,#000c)}.wm{height:54px;display:block;margin:0 0 10px;background:#fff;border-radius:10px;padding:4px}
.logo{font-size:18px;font-weight:800;color:var(--gold);line-height:1.1}.logo small{display:block;font:500 11px 'DM Sans';color:#ddd;letter-spacing:.04em;margin-top:3px}
nav a{color:#cfcfcf;padding:10px 14px;border-radius:12px;cursor:pointer;display:flex;justify-content:space-between;transition:transform .2s cubic-bezier(.3,1.6,.5,1),background .2s}
nav a:hover:not(.act){background:#211d12;transform:translateX(6px)}nav a.act{background:var(--gold);color:#000;font-weight:700;transform:translateX(6px);box-shadow:-4px 4px 0 #8a7a4a}
.badge{background:#fff;color:#000;border-radius:99px;padding:0 7px;font-size:12px;animation:pulse 1.6s infinite}
main{padding:24px 28px;max-width:1040px;width:100%}main.swap{animation:swap .4s cubic-bezier(.2,.8,.2,1)}
main.fresh .grid>.card,main.fresh .cal>div{animation:rise .55s cubic-bezier(.2,.9,.3,1.2) backwards;animation-delay:calc(var(--i,0)*55ms)}
.top{display:flex;gap:10px;margin-bottom:20px;align-items:center}.top>input{margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;perspective:1100px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative;box-shadow:0 2px 0 var(--line),0 10px 24px rgba(0,0,0,.06)}
.ev,.org{transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .2s ease-out,box-shadow .3s;will-change:transform}
.ev:hover,.org:hover{box-shadow:0 18px 40px rgba(0,0,0,.22);z-index:3}
.ev::after,.org::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),#ffffff3a,transparent 60%);opacity:0;transition:opacity .3s}
.ev:hover::after,.org:hover::after{opacity:1}
.ev{display:flex;flex-direction:column;gap:6px}.ev h3{font-size:15px;line-height:1.25}.mut{color:var(--mut);font-size:13px}
.ban{margin:-16px -16px 8px;height:112px;border-radius:var(--r) var(--r) 0 0;overflow:hidden;position:relative;background:#222}
.ban svg,.ban .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}.ev:hover .ban svg,.ev:hover .ban .ph{transform:scale(1.12)}
.date{font-weight:700;color:#9a7d33}@media(prefers-color-scheme:dark){.date{color:var(--gold)}}
.tag{display:inline-block;font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:8px;padding:0 8px;margin-right:4px;background:#cfb87c22}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
h2{font-size:20px;margin:26px 0 14px}h1{font-size:24px}a{color:inherit}
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#000,#2a2312);color:#fff;border-radius:22px;padding:30px;min-height:210px;display:flex;align-items:center;border-bottom:6px solid var(--gold);box-shadow:0 20px 40px rgba(0,0,0,.3)}
.hero .l,.hero .heroimg{position:absolute;inset:0;width:100%;height:100%;transition:transform .2s ease-out}.heroimg{object-fit:cover;opacity:.45}
.l1{transform:translate(calc(var(--px,0)*14px),calc(var(--py,0)*8px)) scale(1.05)}.l2{transform:translate(calc(var(--px,0)*28px),calc(var(--py,0)*14px)) scale(1.05)}
.hc{position:relative;z-index:2;max-width:520px;transform:translate(calc(var(--px,0)*-6px),calc(var(--py,0)*-4px));transition:transform .2s}
.hero h1{font-size:26px;color:var(--gold);line-height:1.15}.hero p{margin:10px 0 0;color:#eee}
.buf{position:absolute;right:26px;bottom:14px;z-index:2;width:130px;transform:translate(calc(var(--px,0)*-30px),calc(var(--py,0)*-16px));transition:transform .2s ease-out}
.buf img{width:100%;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 10px 8px #0008)}.buf svg{width:100%;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 10px 8px #0008)}
.pagehead{height:96px;border-radius:18px;overflow:hidden;position:relative;margin-bottom:8px;border-bottom:4px solid var(--gold)}.pagehead svg,.pagehead .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lg{width:56px;height:56px;border-radius:14px;background:#000;color:var(--gold);display:grid;place-items:center;font:800 15px Unbounded;margin-bottom:8px;position:relative;overflow:hidden;box-shadow:0 5px 0 #8a7a4a}.lg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal div{min-height:76px;border:1px solid var(--line);border-radius:10px;padding:4px;font-size:12px;background:var(--card);transition:transform .2s,box-shadow .2s}.cal div:not(.h):hover{transform:translateY(-3px) scale(1.04);box-shadow:0 8px 16px rgba(0,0,0,.15);z-index:2}
.cal .h{min-height:0;border:0;background:none;text-align:center;color:var(--mut)}.cal i{display:block;font-style:normal;background:var(--gold);color:#111;border-radius:5px;padding:0 5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map{background:linear-gradient(#e3e6df,#d3dbcb);border-radius:var(--r);border:1px solid var(--line);width:100%}.pin{cursor:pointer}.pin circle{transform-box:fill-box;transform-origin:center;transition:transform .25s cubic-bezier(.3,1.8,.5,1)}.pin:hover circle{transform:scale(1.3)}
.dd{position:relative}.dd ul{list-style:none;margin:8px 0 0;padding:6px;position:absolute;right:0;min-width:190px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.25);z-index:6;opacity:0;transform:translateY(-10px) scale(.95);transform-origin:top right;pointer-events:none;transition:.22s cubic-bezier(.3,1.4,.5,1)}
.dd.open ul{opacity:1;transform:none;pointer-events:auto}.dd li{padding:8px 12px;border-radius:9px;cursor:pointer;transition:background .15s,transform .15s}.dd li:hover{background:#cfb87c55;transform:translateX(4px)}.dd li.on{background:var(--gold);color:#111;font-weight:700}
.dd .ddb span{display:inline-block;transition:transform .25s}.dd.open .ddb span{transform:rotate(180deg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}.chip.on{animation:pop .3s}
.modal{position:fixed;inset:0;background:#000a;backdrop-filter:blur(4px);display:none;place-items:center;padding:16px;z-index:9}.modal.show{display:grid}.modal.show .card{animation:mpop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes mpop{from{opacity:0;transform:scale(.8) translateY(30px) rotateX(20deg)}}
.modal .card{width:min(460px,100%);max-height:90vh;overflow:auto}
.av{width:64px;height:64px;border-radius:50%;background:var(--gold);color:#111;display:grid;place-items:center;font:800 24px Unbounded;box-shadow:0 5px 0 #8a7a4a}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:#111;color:var(--gold);padding:11px 20px;border-radius:99px;opacity:0;pointer-events:none;z-index:12;transition:.35s cubic-bezier(.3,1.6,.5,1);font-weight:600}.toast.show{opacity:1;transform:translate(-50%,0)}
.conf{position:fixed;width:9px;height:9px;border-radius:2px;pointer-events:none;z-index:20}
@media(max-width:720px){.app{grid-template-columns:1fr}nav{position:fixed;bottom:0;top:auto;height:auto;flex-direction:row;overflow-x:auto;z-index:5;padding:6px;border-right:0;border-top:4px solid var(--gold)}.brand{display:none}nav a{white-space:nowrap}nav a:hover,nav a.act{transform:none}main{padding:16px 14px 90px}.buf{width:80px}}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}#glow{display:none}}

body::before{content:'';position:fixed;inset:0;background:url(assets/campus.jpg) center/cover;opacity:.08;z-index:0;pointer-events:none}@media(prefers-color-scheme:dark){body::before{opacity:.14}}
#splash{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#2a2312,#000);z-index:50;display:grid;place-items:center;align-content:center;gap:18px;transition:opacity .6s,transform .6s}#splash.out{opacity:0;transform:scale(1.08);pointer-events:none}
#splash img{width:130px;background:#fff;border-radius:26px;padding:8px;animation:mpop .8s cubic-bezier(.2,1.4,.4,1),float 3s 1s infinite}#splash b{color:#cfb87c;font:800 18px Unbounded}#splash i{display:block;width:160px;height:4px;border-radius:4px;background:#333;overflow:hidden}#splash i::after{content:'';display:block;height:100%;background:#cfb87c;animation:load 1.2s ease-out forwards}@keyframes load{from{width:0}to{width:100%}}
.heroimg{opacity:0;animation:hfade 18s infinite}.heroimg:nth-of-type(2){animation-delay:6s}.heroimg:nth-of-type(3){animation-delay:12s}@keyframes hfade{0%{opacity:0;transform:scale(1)}6%{opacity:.5}33%{opacity:.5}40%{opacity:0;transform:scale(1.08)}}
.bdg{position:absolute;left:10px;bottom:8px;width:42px;height:42px;object-fit:contain;background:#fff;border-radius:50%;padding:4px;z-index:2;box-shadow:0 4px 10px #0005;transition:transform .3s cubic-bezier(.3,1.8,.5,1)}.ev:hover .bdg{transform:rotate(-12deg) scale(1.15)}
.pagehead{height:120px}.pagehead .pt{position:absolute;left:18px;bottom:12px;z-index:2;color:#fff;font:800 22px Unbounded;text-shadow:0 2px 12px #000}.pagehead::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#000b,transparent 70%)}.pagehead .bdg{left:auto;right:16px;top:16px;bottom:auto;width:52px;height:52px;z-index:3}
.nvb{width:96px;align-self:center;margin:6px 0 10px;background:#fff;border-radius:18px;padding:6px;transition:transform .4s cubic-bezier(.3,1.8,.5,1)}.nvb:hover{transform:rotate(-8deg) scale(1.12)}
.band{height:170px;border-radius:20px;margin:26px 0 0;background:linear-gradient(#0006,#0006),url(assets/academic.jpg) center/cover fixed;display:flex;align-items:center;justify-content:center;gap:16px;color:#fff;font:800 22px Unbounded;box-shadow:0 14px 30px rgba(0,0,0,.25);border-bottom:5px solid var(--gold)}.band img{height:80px;background:#fff;border-radius:16px;padding:5px}
.org .ban{height:78px}.org .lg{margin-top:-36px;margin-left:6px;z-index:2;border:3px solid var(--card)}
.mh{margin:-16px -16px 14px;height:110px;border-radius:var(--r) var(--r) 0 0;background:url(assets/campus.jpg) center/cover;position:relative}.mh::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent,#0008)}.mh img{position:absolute;left:16px;bottom:-22px;height:54px;background:#fff;border-radius:12px;padding:4px;z-index:2;box-shadow:0 4px 12px #0005}.mh+*{margin-top:26px!important}
.nrow{display:flex;gap:12px;align-items:center;margin-bottom:8px}.nrow img{width:38px;height:38px;object-fit:contain;flex:none}
.wm2{margin-left:auto;height:60px;background:#fff;border-radius:14px;padding:4px}
.empty{text-align:center;padding:24px;grid-column:1/-1;color:var(--mut)}.empty img{height:90px;background:#fff;border-radius:18px;padding:6px;animation:float 4s infinite}
.foot{margin-top:40px;border-radius:20px;overflow:hidden;background:linear-gradient(#000b,#000d),url(assets/campus.jpg) center/cover;color:#fff;padding:26px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;border-top:5px solid var(--gold)}.foot img{height:56px;background:#fff;border-radius:12px;padding:4px}.foot p{margin:0;flex:1;min-width:200px;font-size:13px;color:#ddd}.foot b{font:800 18px Unbounded;color:var(--gold)}
.ban{position:relative}.credit{position:absolute;right:6px;bottom:4px;font-size:10px;color:#fff;background:#000a;padding:1px 6px;border-radius:6px;text-decoration:none;opacity:.85}
</style></head><body>
<div id="splash"><img src="assets/cu-logo.png" alt="CU Boulder"><b>Go Buffs</b><i></i></div><div id="glow"></div><div class="app"><nav id="nav"></nav><main id="main"></main></div>
<div class="modal" id="modal"><div class="card" id="mbody"></div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const BUFF=`<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M9 24Q1 10 15 7Q11 16 21 21Z M55 24Q63 10 49 7Q53 16 43 21Z" fill="#cfb87c"/><ellipse cx="32" cy="35" rx="23" ry="24" fill="#2b2b2b"/><path d="M19 38Q32 66 45 38Q32 27 19 38Z" fill="#6b5a3a"/><ellipse cx="32" cy="50" rx="8" ry="5" fill="#cfb87c"/><circle cx="24" cy="36" r="2.4" fill="#fff"/><circle cx="40" cy="36" r="2.4" fill="#fff"/></svg>`;
const MARK=`<svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><path d="M2 32L12 6L20 24L25 14L32 32Z" fill="#cfb87c"/></svg>`;
const SRC={stamp:'https://boulderdowntown.com/events/pearl-street-stampedes',cal:'https://calendar.colorado.edu/',ath:'https://cubuffs.com/news/2026/4/10/colorados-home-football-game-vs-houston-moved-to-nov-13-homecoming-moved-to-oct-3',wb:'https://www.colorado.edu/coloradan/2026/07/20/cu-boulders-wayback-machine',ac:'https://www.colorado.edu/academics/academic-calendar',ev:'https://www.colorado.edu/events/',mkt:'https://www.bouldercoloradousa.com/events/annual-events/'};
const ORGS=[
{id:1,name:'CU Buffs Athletics',cat:'Football',desc:'Home games at Folsom Field for the Colorado Buffaloes.'},
{id:2,name:'Downtown Boulder',cat:'Community',desc:'Hosts the Pearl Street Stampedes before every CU home football game.'},
{id:3,name:'CU Alumni Association',cat:'Homecoming',desc:'Homecoming weekend, reunions and Forever Buffs events.'},
{id:4,name:'CU Presents',cat:'Arts',desc:'Concerts and performances at CU Boulder.'},
{id:5,name:'CU Boulder Campus',cat:'Academic',desc:'Official academic calendar dates and university events.'}];
const PLACES={'Folsom Field':[90,220],'UMC / University Club':[170,100],'Norlin Quad':[300,120],'Koenig Alumni Center':[440,60],'Pearl Street Mall':[470,230]};
const E=(id,title,org,place,at,tba,cat,desc,src)=>({id,title,org,place,at,tba,cat,desc,src,going:[],interested:[]});
const EVENTS=[
E(1,'Culture Crawl',3,'Norlin Quad','2026-09-30T10:00',1,'Homecoming','Homecoming week kickoff: a crawl through 20+ campus arts centers, heritage collections and cultural hubs. Check the Homecoming site for the schedule.',SRC.wb),
E(2,'Pick up a free gift at the CU Presents Box Office',4,'UMC / University Club','2026-09-30T10:00',0,'Campus','Free. Wednesday, 10 a.m. to 5 p.m. at the University Club box office.',SRC.cal),
E(3,'Pearl Street Stampede and Homecoming Parade',2,'Pearl Street Mall','2026-10-02T19:00',0,'Homecoming','Golden Buffalo Marching Band, Colorado Spirit squad and CU athletes on the 1300 block of Pearl Street, in front of the County Courthouse.',SRC.stamp),
E(4,'Homecoming: Colorado vs. Texas Tech',1,'Folsom Field','2026-10-03T17:30',0,'Football','Kickoff 5:30 p.m. MT on FOX. Homecoming game for CU’s 150th anniversary with a black-and-gold stripe-out. Alumni tailgate beforehand.',SRC.ath),
E(5,'Midsemester Reading Day',5,'Norlin Quad','2026-10-08T09:00',1,'Academic','No classes. Thursday, Oct. 8.',SRC.ac),
E(6,'Family Weekend',3,'Norlin Quad','2026-10-15T09:00',1,'Campus','Oct. 15 to 18. Families visit campus; includes the Utah game on Oct. 17.',SRC.ev),
E(7,'Pearl Street Stampede (Family Weekend)',2,'Pearl Street Mall','2026-10-16T19:00',0,'Community','Kickoff celebration the night before the Utah game, 1300 block of Pearl Street.',SRC.stamp),
E(8,'Colorado vs. Utah',1,'Folsom Field','2026-10-17T12:00',1,'Football','Family Weekend home game. Kickoff time to be announced by the Big 12.',SRC.ath),
E(9,'Starting Blocks Customer Discovery Workshop',5,'UMC / University Club','2026-10-29T09:00',1,'Career','Free with application. Listed on the CU Boulder events calendar (Boulder, CO).',SRC.cal),
E(10,'Pearl Street Stampede (Kansas State)',2,'Pearl Street Mall','2026-10-30T19:00',0,'Community','Kickoff celebration the night before the Kansas State game.',SRC.stamp),
E(11,'Colorado vs. Kansas State',1,'Folsom Field','2026-10-31T12:00',1,'Football','Home game. Kickoff time to be announced by the Big 12.',SRC.ath),
E(12,'Health and Wellness Summit',5,'UMC / University Club','2026-11-04T09:00',1,'Campus','Nov. 4 to 5. See the CU Boulder events page for the program.',SRC.ev),
E(13,'Pearl Street Stampede (Houston)',2,'Pearl Street Mall','2026-11-12T19:00',0,'Community','Thursday kickoff celebration before Friday’s game.',SRC.stamp),
E(14,'Colorado vs. Houston',1,'Folsom Field','2026-11-13T18:00',1,'Football','Friday game on national TV. Time and network to be announced.',SRC.ath),
E(15,'Fall Break',5,'Norlin Quad','2026-11-23T09:00',1,'Academic','No classes Nov. 23 to 25. Campus closed Nov. 26 to 27 for Thanksgiving.',SRC.ac)];
function load(){try{return JSON.parse(localStorage.getItem('campus2'))}catch(e){return null}}
function save(){try{localStorage.setItem('campus2',JSON.stringify({user:S.user,follows:S.follows,notifs:S.notifs,seq:S.seq,rs:Object.fromEntries(S.events.map(e=>[e.id,[e.going,e.interested]]))}))}catch(e){}}
let S={events:EVENTS,user:null,follows:[],notifs:[{id:1,msg:'Welcome to Campus! Follow organizations to personalize your feed.',read:false}],seq:100};
const sv=load();if(sv){S.user=sv.user;S.follows=sv.follows;S.notifs=sv.notifs;S.seq=sv.seq;S.events.forEach(e=>{const r=sv.rs[e.id];if(r){e.going=r[0];e.interested=r[1]}})}
let fresh=true,lx=0,ly=0,view='home',q='',catF='',calM=new Date(2026,9,1),pend='';
const org=id=>ORGS.find(o=>o.id==id);
const me=()=>S.user?S.user.phone:'guest';
const fmt=e=>{const d=new Date(e.at),ds=d.toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'});return e.tba?ds+' · time TBA':ds+' · '+d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})};
const cnt=e=>e.going.length+e.interested.length;
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2400)}
function need(){if(!S.user){modal(signin());return false}return true}
function modal(h){$('#mbody').innerHTML=h;$('#modal').classList.add('show')}
function closeM(){$('#modal').classList.remove('show')}
$('#modal').onclick=e=>{if(e.target.id=='modal')closeM()};
const CATS=['Football','Homecoming','Community','Campus','Career','Academic'];
function signin(){return `<div class="mh"><img src="assets/wordmark.png" alt="University of Colorado Boulder"></div><h2 style="margin-top:0">Sign in with your phone</h2><p class="mut">We’ll text you a 6-digit code. Demo mode: no text is sent, and any 6 digits work.</p>
<label>Name<input id="sn" autocomplete="name"></label><label>Phone number<input id="sp" type="tel" inputmode="tel" placeholder="(303) 555-0123" autocomplete="tel"></label>
<div>Interests</div><div class="chips">${CATS.map(c=>`<button type="button" class="chip" onclick="this.classList.toggle('on')">${c}</button>`).join('')}</div>
<div class="row sp"><button onclick="closeM()">Cancel</button><button class="p" onclick="sendCode()">Send code</button></div>`}
function sendCode(){const n=$('#sn').value.trim(),d=$('#sp').value.replace(/\D/g,'').replace(/^1(?=\d{10}$)/,'');
if(!n||d.length!=10){toast('Enter your name and a 10-digit US phone number');return}
pend={name:n,phone:`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`,interests:[...document.querySelectorAll('.chip.on')].map(b=>b.textContent)};
modal(`<h2 style="margin-top:0">Enter your code</h2><p class="mut">Sent to ${pend.phone}.</p><label>6-digit code<input id="sc" inputmode="numeric" maxlength="6"></label>
<div class="row sp"><button onclick="modal(signin())">Back</button><button class="p" onclick="verify()">Verify</button></div>`)}
function verify(){if(!/^\d{6}$/.test($('#sc').value)){toast('Enter the 6-digit code');return}S.user=pend;save();closeM();toast('Signed in');render()}
function rsvp(id,kind){if(!need())return;const ev=S.events.find(e=>e.id==id),m=me();
['going','interested'].forEach(k=>{ev[k]=ev[k].filter(x=>x!=m)});if(kind!='none')ev[kind].push(m);
if(kind=='going')setTimeout(()=>burst(lx,ly),30);if(kind=='going')S.notifs.unshift({id:++S.seq,msg:`You’re going: ${ev.title} (${fmt(ev)})`,read:false});save();render()}
function follow(id){if(!need())return;const i=S.follows.indexOf(id);
if(i>-1)S.follows.splice(i,1);else{S.follows.push(id);S.notifs.unshift({id:++S.seq,msg:`You’re now following ${org(id).name}`,read:false})}save();render()}
function score(e){let s=0;if(S.follows.includes(e.org))s+=2;if(S.user&&S.user.interests.includes(e.cat))s+=1.5;return s-new Date(e.at)/1e13}
function upcoming(){const n=Date.now()-864e5;return S.events.filter(e=>new Date(e.at)>=n).sort((a,b)=>a.at<b.at?-1:1)}
function card(e){const m=me(),g=e.going.includes(m),i=e.interested.includes(m);
return `<div class="card ev">${e.photo?realPhoto(e.photo):banner(e.cat)}<span class="date">${fmt(e)}</span><h3>${e.title}</h3><div class="mut">${org(e.org).name} · ${e.place}</div><div><span class="tag">${e.cat}</span></div>
<p style="margin:0">${e.desc}</p><div class="mut">${cnt(e)?cnt(e)+' from this device going or saved · ':''}<a href="${e.src}" target="_blank" rel="noopener">Source</a></div>
<div class="row"><button class="${g?'on':''}" onclick="rsvp(${e.id},'${g?'none':'going'}')">${g?'Going':'RSVP'}</button><button class="${i?'on':''}" onclick="rsvp(${e.id},'${i?'none':'interested'}')">${i?'Saved':'Save'}</button></div></div>`}
function match(e){const s=q.toLowerCase();return(!s||(e.title+e.desc+e.place+e.cat+org(e.org).name).toLowerCase().includes(s))&&(!catF||e.cat==catF)}
const V={
home(){const up=upcoming().filter(match),fy=[...upcoming()].sort((a,b)=>score(b)-score(a)).slice(0,3);
if(q||catF)return `<h2 style="margin-top:0">Results</h2><div class="grid">${up.map(card).join('')||empty('No events match. Try a different search.')}</div>`;
const k=new Date('2026-10-03T17:30'),dl=Math.ceil((k-Date.now())/864e5);
return `<div class="hero" id="hero">${HEROBG}<div class="buf"><img src="assets/buffalo-logo.png" alt="CU Buffaloes logo" onerror="this.outerHTML=BUFF"></div><div class="hc"><h1>${S.user?'Hey '+S.user.name.split(' ')[0]+', ':''}Homecoming is ${dl>0?'in '+dl+' day'+(dl==1?'':'s'):'here'}</h1><p>CU’s 150th anniversary. Colorado vs. Texas Tech, Saturday Oct. 3, 5:30 p.m. at Folsom Field.</p></div></div>
<h2>For you</h2><p class="mut" style="margin-top:-8px">${S.user?'Ranked by your interests, organizations you follow and date.':'Sign in to personalize this list.'}</p><div class="grid">${fy.map(card).join('')}</div>
<h2>Around campus</h2><div class="gal"><figure><img src="assets/campus.jpg" alt="Campus below the Flatirons"><figcaption>CU Boulder below the Flatirons</figcaption></figure><figure><img src="assets/academic.jpg" alt="Old Main in snow"><figcaption>Old Main in snow</figcaption></figure><figure><img src="assets/homecoming.jpg" alt="Old Main in fall color"><figcaption>Old Main in fall color</figcaption></figure><figure><img src="assets/football.jpg" alt="Ralphie running"><figcaption>Ralphie leads the Buffs out</figcaption></figure></div><div class="band"><img src="assets/cu-logo.png" alt=""><span>Go Buffs</span><img src="assets/buffalo-logo.png" alt=""></div><h2>Upcoming</h2><div class="grid">${up.map(card).join('')}</div>`},
calendar(){const y=calM.getFullYear(),m=calM.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
let h=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="h">${x}</div>`).join('')+'<div style="border:0;background:none"></div>'.repeat(first);
for(let i=1;i<=n;i++){const ev=S.events.filter(e=>{const z=new Date(e.at);return z.getFullYear()==y&&z.getMonth()==m&&z.getDate()==i});h+=`<div><b>${i}</b>${ev.map(e=>`<i title="${e.title}">${e.title}</i>`).join('')}</div>`}
return `<div class="row sp"><h2 style="margin:0">${calM.toLocaleString([], {month:'long',year:'numeric'})}</h2><div class="row"><button onclick="calM=new Date(calM.getFullYear(),calM.getMonth()-1,1);render()" aria-label="Previous month">‹</button><button onclick="calM=new Date(calM.getFullYear(),calM.getMonth()+1,1);render()" aria-label="Next month">›</button></div></div><div class="cal" style="margin-top:12px">${h}</div>`},
map(){const pins=Object.entries(PLACES).map(([n,[x,z]])=>{const c=S.events.filter(e=>e.place==n).length;
return `<g class="pin" tabindex="0" onclick="pinClick('${n}')" onkeydown="if(event.key=='Enter')pinClick('${n}')"><circle cx="${x}" cy="${z}" r="${14+c*2}" fill="#cfb87c" stroke="#111" stroke-width="2"/><text x="${x}" y="${z+4}" text-anchor="middle" font-weight="700" font-size="12" fill="#111">${c}</text><text x="${x}" y="${z+34+c*2}" text-anchor="middle" font-size="11" fill="#111">${n}</text></g>`}).join('');
return `<h2 style="margin-top:0">Campus map</h2><p class="mut">Tap a location to see its events. Schematic layout, not to scale.</p>
<svg class="map" viewBox="0 0 560 300" role="img" aria-label="Campus event map"><image href="assets/campus.jpg" width="560" height="300" preserveAspectRatio="xMidYMid slice" opacity=".4"/><image href="assets/cu-logo.png" x="480" y="10" width="64" height="64"/>${pins}</svg><div id="pinlist" class="grid" style="margin-top:14px"></div>`},
orgs(){return `<h2 style="margin-top:0">Organizations</h2><div class="grid">${ORGS.map(o=>{const f=S.follows.includes(o.id);return `<div class="card org"><div class="ban"><img class="ph" src="assets/${['campus','academic','homecoming'][o.id%3]}.jpg" alt="" onerror="this.remove()"></div><div class="lg"><img src="assets/org-${o.id}.png" alt="" onerror="this.remove()"><b>${o.name.split(' ').map(w=>w[0]).slice(0,3).join('')}</b></div><h3>${o.name}</h3><span class="tag">${o.cat}</span><p>${o.desc}</p><div class="mut">${S.events.filter(e=>e.org==o.id).length} events listed</div><div class="row" style="margin-top:8px"><button class="${f?'on':''}" onclick="follow(${o.id})">${f?'Following':'Follow'}</button><button onclick="q='${o.name}';go('home')">See events</button></div></div>`}).join('')}</div>`},
notifs(){S.notifs.forEach(n=>n.read=true);save();return `<h2 style="margin-top:0">Notifications</h2>${S.notifs.map(n=>`<div class="card nrow"><img src="assets/cu-logo.png" alt="" onerror="this.remove()"><span>${n.msg}</span></div>`).join('')}`},
profile(){if(!S.user)return `<h2 style="margin-top:0">Profile</h2><p>Sign in to see your profile.</p><button class="p" onclick="modal(signin())">Sign in</button>`;
const m=me(),g=S.events.filter(e=>e.going.includes(m)),i=S.events.filter(e=>e.interested.includes(m)),p=S.user.phone;
return `<div class="row"><div class="av">${S.user.name[0].toUpperCase()}</div><div><h1>${S.user.name}</h1><div class="mut">${p.slice(0,6)}•••-${p.slice(-4)}</div></div><img class="wm2" src="assets/cu-logo.png" alt=""></div>
<h2>Interests</h2><div>${S.user.interests.map(x=>`<span class="tag">${x}</span>`).join('')||'<span class="mut">None chosen</span>'}</div>
<h2>Following</h2><div>${S.follows.map(id=>`<span class="tag">${org(id).name}</span>`).join('')||'<span class="mut">No organizations yet</span>'}</div>
<h2>Going</h2><div class="grid">${g.map(card).join('')||empty('No RSVPs yet.')}</div>
<h2>Saved</h2><div class="grid">${i.map(card).join('')||empty('Nothing saved.')}</div><p><button onclick="S.user=null;save();render()">Sign out</button></p>`}};
function pinClick(n){$('#pinlist').innerHTML=upcoming().filter(e=>e.place==n).map(card).join('')||empty('No events here yet.')}
function newEv(){if(!need())return;modal(`<h2 style="margin-top:0">Create event</h2><label>Title<input id="et"></label>
<label>Host<select id="eo">${ORGS.map(o=>`<option value="${o.id}">${o.name}</option>`).join('')}</select></label>
<label>Location<select id="ep">${Object.keys(PLACES).map(p=>`<option>${p}</option>`).join('')}</select></label>
<label>Category<select id="ec">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></label>
<label>Date and time<input id="ed" type="datetime-local"></label><label>Description<textarea id="ex" rows="3"></textarea></label>
<div class="row sp"><button onclick="closeM()">Cancel</button><button class="p" onclick="saveEv()">Publish event</button></div>`)}
function saveEv(){const ti=$('#et').value.trim(),d=$('#ed').value;if(!ti||!d){toast('Add a title and a date');return}
S.events.push(E(++S.seq,ti,+$('#eo').value,$('#ep').value,d,0,$('#ec').value,$('#ex').value||'No description yet.',SRC.ev));closeM();toast('Event added (this device only)');go('home')}

const HEROBG=`<img class="heroimg" src="assets/campus.jpg" alt="" onerror="this.remove()"><img class="heroimg" src="assets/academic.jpg" alt="" onerror="this.remove()"><img class="heroimg" src="assets/homecoming.jpg" alt="" onerror="this.remove()"><svg class="l l2" viewBox="0 0 600 240" preserveAspectRatio="xMidYMax slice"><circle cx="430" cy="70" r="46" fill="#cfb87c" opacity=".85"/><path d="M0 240L110 70L150 120L210 40L300 240Z" fill="#7a3a24"/></svg><svg class="l l1" viewBox="0 0 600 240" preserveAspectRatio="xMidYMax slice"><path d="M180 240L300 90L340 130L400 60L560 240Z" fill="#b4573a" opacity=".9"/><path d="M0 240V205Q150 185 300 210T600 200V240Z" fill="#111"/></svg>`;
const ART={Football:`<rect width="300" height="120" fill="#1f5a34"/>${[0,1,2,3,4,5].map(i=>`<rect x="${i*50}" width="25" height="120" fill="#27703f"/>`).join('')}<path d="M0 60H300M150 0V120" stroke="#fff" stroke-opacity=".55"/><circle cx="150" cy="60" r="22" fill="none" stroke="#fff" stroke-opacity=".55"/><path d="M252 120V72M238 72H266M238 72V48M266 72V48" stroke="#cfb87c" stroke-width="4" fill="none"/>`,
Homecoming:`<rect width="300" height="120" fill="#000"/><path d="M60 0L20 120H100Z M150 0L110 120H190Z M240 0L200 120H280Z" fill="#cfb87c" opacity=".2"/><path d="M0 14Q75 40 150 14T300 14" stroke="#cfb87c" fill="none" stroke-width="2"/>${[30,90,150,210,270].map((x,i)=>`<path d="M${x-12} ${i%2?30:20}h24l-12 26Z" fill="${i%2?'#fff':'#cfb87c'}"/>`).join('')}`,
Community:`<rect width="300" height="120" fill="#1b1f2a"/><path d="M0 26Q75 66 150 26T300 26" stroke="#666" fill="none"/>${[15,50,85,120,155,190,225,260,290].map(x=>`<circle cx="${x}" cy="${30+14*Math.sin(x/24)}" r="5" fill="#cfb87c"/>`).join('')}<path d="M0 120V96H40V80H70V100H120V70H160V96H220V84H260V100H300V120Z" fill="#0d0f15"/>`};
const SKY={Campus:'#dbe7ef',Career:'#e8dcc4',Academic:'#d5dbe8'};
function realPhoto(p){return `<div class="ban"><img class="ph" loading="lazy" alt="" src="${p.url}"><a class="credit" href="${p.creditUrl}?utm_source=campus-site&utm_medium=referral" target="_blank" rel="noopener">Photo: ${p.credit} / Unsplash</a></div>`}
function banner(c){const inner=ART[c]||`<rect width="300" height="120" fill="${SKY[c]||'#dbe7ef'}"/><circle cx="240" cy="32" r="16" fill="#cfb87c"/><path d="M0 120L60 40L85 70L120 20L165 120Z" fill="#b4573a"/><path d="M110 120L170 52L200 82L240 44L300 120Z" fill="#8f432c"/><rect y="102" width="300" height="18" fill="#3d6b3a"/>`;
return `<div class="ban"><svg viewBox="0 0 300 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${inner}</svg><img class="ph" loading="lazy" alt="" src="assets/${c.toLowerCase()}.jpg" onerror="this.remove()"><img class="bdg" src="assets/${c=='Football'?'buffalo-logo':'cu-logo'}.png" alt="" onerror="this.remove()"></div>`}
function pagehead(){const c={calendar:'Campus',map:'Campus',orgs:'Homecoming',notifs:'Community',profile:'Football'}[view]||'Campus';return `<div class="pagehead"><svg viewBox="0 0 300 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${ART[c]||`<rect width="300" height="120" fill="#dbe7ef"/><circle cx="240" cy="32" r="16" fill="#cfb87c"/><path d="M0 120L60 40L85 70L120 20L165 120Z" fill="#b4573a"/><path d="M110 120L170 52L200 82L240 44L300 120Z" fill="#8f432c"/>`}</svg><img class="ph" alt="" src="assets/${view}.jpg" onerror="this.remove()"><b class="pt">${TITLES[view]}</b><img class="bdg" src="assets/cu-logo.png" alt="" onerror="this.remove()"></div>`}
const TITLES={calendar:'Calendar',map:'Campus map',orgs:'Organizations',notifs:'Notifications',profile:'Profile'};
const empty=t=>`<div class="empty"><img src="assets/buffalo-logo.png" alt="" onerror="this.remove()"><p>${t}</p></div>`;
const foot=()=>`<div class="foot"><img src="assets/wordmark.png" alt="University of Colorado Boulder"><p><b>Go Buffs</b><br>Unofficial student project. Logos and photos belong to CU Boulder and their owners. Check calendar.colorado.edu for the latest event details.</p><img src="assets/buffalo-logo.png" alt="" style="height:64px"></div>`;
function ddHTML(){return `<div class="dd" id="dd"><button class="ddb" onclick="toggleDD(event)">${catF||'All categories'} <span>▾</span></button><ul>${['',...CATS].map(c=>`<li onclick="setCat('${c}')" class="${c==catF?'on':''}">${c||'All categories'}</li>`).join('')}</ul></div>`}
function toggleDD(e){e.stopPropagation();$('#dd').classList.toggle('open')}
function setCat(c){catF=c;render()}
function burst(x,y){for(let i=0;i<22;i++){const p=document.createElement('span');p.className='conf';p.style.left=x+'px';p.style.top=y+'px';p.style.background=['#cfb87c','#111','#fff','#b4573a'][i%4];document.body.appendChild(p);const a=Math.random()*6.28,d=60+Math.random()*90;p.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+60}px) rotate(${Math.random()*720}deg)`,opacity:0}],{duration:900,easing:'cubic-bezier(.2,.8,.4,1)'}).onfinish=()=>p.remove()}}
let tc=null,mb=null;
document.addEventListener('click',e=>{lx=e.clientX;ly=e.clientY;const d=$('#dd');if(d)d.classList.remove('open');const b=e.target.closest('button');if(b){const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height),sp=document.createElement('span');sp.className='rip';sp.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;b.appendChild(sp);setTimeout(()=>sp.remove(),650)}});
document.addEventListener('mousemove',e=>{const g=$('#glow');if(g)g.style.transform=`translate(${e.clientX-200}px,${e.clientY-200}px)`;
const c=e.target.closest('.ev,.org');if(tc&&tc!==c){tc.style.setProperty('--rx','0deg');tc.style.setProperty('--ry','0deg')}tc=c;
if(c){const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;c.style.setProperty('--ry',((x-.5)*14)+'deg');c.style.setProperty('--rx',((.5-y)*14)+'deg');c.style.setProperty('--mx',x*100+'%');c.style.setProperty('--my',y*100+'%')}
const h=e.target.closest('.hero');if(h){const r=h.getBoundingClientRect();h.style.setProperty('--px',((e.clientX-r.left)/r.width-.5)*2);h.style.setProperty('--py',((e.clientY-r.top)/r.height-.5)*2)}
const b=e.target.closest('button.p,button.on');if(mb&&mb!==b){mb.style.setProperty('--tx','0px');mb.style.setProperty('--ty','0px')}mb=b;
if(b){const r=b.getBoundingClientRect();b.style.setProperty('--tx',(e.clientX-r.left-r.width/2)*.22+'px');b.style.setProperty('--ty',(e.clientY-r.top-r.height/2)*.3+'px')}});
function go(v){view=v;fresh=true;render();const m=$('#main');m.classList.remove('swap');void m.offsetWidth;m.classList.add('swap')}
function render(){const un=S.notifs.filter(n=>!n.read).length;
$('#nav').innerHTML=`<div class="brand">${MARK}<div class="logo">CU Buffs<small>Campus · Boulder</small></div></div>`+[['home','Home'],['calendar','Calendar'],['map','Map'],['orgs','Organizations'],['notifs','Alerts'],['profile','Profile']].map(([k,l])=>`<a class="${view==k?'act':''}" onclick="go('${k}')">${l}${k=='notifs'&&un?`<span class="badge">${un}</span>`:''}</a>`).join('')+`<div style="flex:1"></div><img class="nvb" src="assets/buffalo-logo.png" alt="" onerror="this.remove()">${S.user?'':'<button class="on" onclick="modal(signin())">Sign in</button>'}`;
const bar=view=='home'?`<div class="top"><input id="qi" placeholder="Search events, organizations, places" value="${q}" aria-label="Search">${ddHTML()}<button class="p" onclick="newEv()" style="white-space:nowrap">New event</button></div>`:'';
$('#main').innerHTML=bar+(view!='home'?pagehead():'')+V[view]()+foot();const m=$('#main');m.classList.toggle('fresh',fresh);m.querySelectorAll('.grid>.card,.cal>div').forEach((c,i)=>c.style.setProperty('--i',i%14));fresh=false;
if(view=='home'){const qi=$('#qi');qi.oninput=e=>{q=e.target.value;const p=e.target.selectionStart;render();const n=$('#qi');n.focus();n.setSelectionRange(p,p)};}}
render();
setTimeout(()=>{const p=$('#splash');if(p){p.classList.add('out');setTimeout(()=>p.remove(),700)}},1400);
// Merge in live CU Boulder events fetched daily by the Netlify function.
// Fails silently and leaves the built-in event list untouched if unavailable.
fetch('/.netlify/functions/get-events').then(r=>r.ok?r.json():null).then(d=>{
  if(!d||!d.events||!d.events.length)return;
  const now=Date.now(),known=new Set(S.events.map(e=>e.title+e.at));
  d.events.forEach(le=>{
    if(new Date(le.at).getTime()<now-864e5)return;
    if(known.has(le.title+le.at))return;
    S.events.push({id:le.id,title:le.title,org:5,place:le.place,at:le.at,tba:le.tba,cat:le.cat,desc:le.desc,src:le.src,photo:le.photo,going:[],interested:[]});
  });
  render();
}).catch(()=>{});

</script></body></html>
